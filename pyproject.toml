[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eco-monitor"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["monitoring*", "eco_monitor*"]

[tool.black]
line-length = 100
target-version = ['py311']
extend-exclude = '''
/(
    migrations
    | manage\.py
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
extend_skip_glob = ["*/migrations/*"]

[tool.pylint.main]
fail-under = 7.0
ignore-paths = "migrations"